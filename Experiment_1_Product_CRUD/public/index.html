<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Experiment 1 - Product CRUD</title>
  <link rel="stylesheet" href="style.css"><script src="app.js" defer></script>
</head>
<body>
  <main class="wrap">
    <h1>Experiment 1: Product CRUD</h1>
    <p>RESTful CRUD operations using Express.js (Name, Price and Description).</p>
    <section class="panel">
      <h2 id="formTitle">Add Product</h2>
      <form id="productForm">
        <input id="name" placeholder="Product name" required>
        <input id="price" type="number" min="0" step="0.01" placeholder="Price" required>
        <textarea id="description" placeholder="Product description"></textarea>
        <button id="saveBtn">Add Product</button>
        <button type="button" class="secondary" id="cancelBtn" hidden>Cancel Edit</button>
      </form>
      <p id="message"></p>
    </section>
    <section><h2>Product List</h2><div id="products"></div></section>
  </main>
</body>
</html>
